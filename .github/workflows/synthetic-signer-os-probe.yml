name: Experimental guarded signer engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Build source-isolated nonlocal return experiment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-x86-64-dev cmake make
          mkdir upstream
          git -C upstream init -q
          git -C upstream remote add origin https://github.com/zhkl0228/unidbg.git
          git -C upstream sparse-checkout init --cone
          git -C upstream sparse-checkout set backend/unicorn2/src/main/native
          git -C upstream fetch --depth 1 --filter=blob:none origin cb848be15386efb96336ef1d5a1422fc823a01cd
          git -C upstream checkout -q FETCH_HEAD
          git clone --depth 1 --branch 2.1.4 https://github.com/unicorn-engine/unicorn.git engine
          test "$(git -C engine rev-parse HEAD)" = 8028ec436f2d9376525352dd38ed9ed6b9f6be10
          git -C engine apply "$PWD"/upstream/backend/unicorn2/src/main/native/patches/*.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engine/qemu/include/sysemu/os-win32.h');s=p.read_text()
          # Literal replacement is intentionally restricted to the three portable aliases.
          old='\n'.join(['#define sigjmp_buf jmp_buf','#define sigsetjmp(env, savemask) setjmp(env)','#define siglongjmp(env, val) longjmp(env, val)']).replace('\\n','\n')
          old=old.replace('\n','\n')
          assert s.count(old)==1
          new='''#if defined(_WIN64) && defined(__GNUC__) && !defined(_MSC_VER)
          /* Experimental GCC-owned nonlocal return for translated ARM execution.
           * Avoid mixing the system CRT's CFG-validated jmp_buf with JIT frames.
           * This does not alter process mitigations or normal C runtime setjmp users.
           */
          typedef intptr_t unicorn_builtin_jmp_buf[5];
          #define sigjmp_buf unicorn_builtin_jmp_buf
          #define sigsetjmp(env, savemask) __builtin_setjmp((intptr_t *)(env))
          #define siglongjmp(env, val) do { if ((val) != 1) abort(); __builtin_longjmp((intptr_t *)(env), 1); } while (0)
          #else
          '''+old+'''
          #endif'''
          p.write_text(s.replace(old,new))
          PY
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=../cmake/mingw-w64.cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON '-DUNICORN_ARCH=arm;aarch64' -DUNICORN_BUILD_TESTS=OFF
          cmake --build engine/build --target unicorn_archive -j4
          mkdir -p result/win-jni
          cat > result/win-jni/jni_md.h <<'HEADER'
          #ifndef _JAVASOFT_JNI_MD_H_
          #define _JAVASOFT_JNI_MD_H_
          #define JNIEXPORT __declspec(dllexport)
          #define JNIIMPORT __declspec(dllimport)
          #define JNICALL __stdcall
          typedef long jint;
          typedef long long jlong;
          typedef signed char jbyte;
          #endif
          HEADER
          native=upstream/backend/unicorn2/src/main/native
          x86_64-w64-mingw32-gcc -shared -O3 -static -DNDEBUG -I engine/include -I "$JAVA_HOME/include" -I result/win-jni "$native/unicorn.c" "$native/sample_arm.c" "$native/sample_arm64.c" engine/build/libunicorn.a -lws2_32 -lpthread -o result/unicorn.dll
          git -C engine diff > result/engine.patch
          printf 'unidbg=cb848be15386efb96336ef1d5a1422fc823a01cd\nunicorn=8028ec436f2d9376525352dd38ed9ed6b9f6be10\n' > result/provenance.txt
          x86_64-w64-mingw32-gcc --version >> result/provenance.txt
          sha256sum result/unicorn.dll >> result/provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-unicorn
          path: result/
          retention-days: 3
  probe:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-unicorn
          path: native-candidate
      - name: Verify original public runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path $env:RUNNER_TEMP 'hongguo-synthetic-signer'
          $outRoot = Join-Path $env:GITHUB_WORKSPACE 'signer-evidence'
          New-Item -ItemType Directory -Path $probeRoot,$outRoot -Force | Out-Null
          $receipt = [ordered]@{scope='one synthetic signing operation; no account or upstream request'; stage='setup'; platform=$env:RUNNER_ARCH; os=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber); productChanged=$false; accountAccess=$false; requestCount=0}
          function Save-Receipt { $receipt | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $outRoot 'result.json') -Encoding utf8 }
          Save-Receipt
          try {
            $installer = Join-Path $probeRoot 'verified-setup.exe'
            Invoke-WebRequest 'https://github.com/waligoraamodio288-rgb/hongguo-desktop-releases/releases/download/v1.0.35/hongguo-1.0.35-windows-x86_64-setup.exe' -OutFile $installer
            if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f1652a5d564890a97532389a5e532c2f71d9e7e80df439527c29c2be38025e88') { throw 'Installer hash mismatch' }
            $extract = Join-Path $probeRoot 'extracted'
            & 7z x $installer "-o$extract" 'backend\sign\*' 'backend\capture\fq_oversea\*' 'backend\jre\*' -y *> (Join-Path $outRoot 'extract.log')
            if ($LASTEXITCODE -ne 0) { throw '7z extraction failed' }
            $jar = @(Get-ChildItem $extract -Recurse -File -Filter unidbg-sign.jar)
            if ($jar.Count -ne 1) { throw 'Expected exactly one signer jar' }
            if ((Get-FileHash $jar[0].FullName).Hash.ToLowerInvariant() -ne '03b6984d56682fbde0d941ca3ae7177260189a3c9da4a18732d1bae064bb1ecd') { throw 'Signer jar mismatch' }
            $backend = $jar[0].Directory.Parent.FullName
            $java = Join-Path $backend 'jre\bin\java.exe'
            if (!(Test-Path -LiteralPath $java)) { throw 'Bundled x64 Java missing' }
            $receipt.javaSha256=(Get-FileHash $java).Hash.ToLowerInvariant()
            $receipt.javaVersion=(Get-Item $java).VersionInfo.FileVersion
            $receipt.crt=(Get-Item "$env:WINDIR\System32\msvcrt.dll").VersionInfo.FileVersion
            $receipt.crtSha256=(Get-FileHash "$env:WINDIR\System32\msvcrt.dll").Hash.ToLowerInvariant()
          
            $receipt.stage='runtime-extracted'; Save-Receipt
            "PROBE_BACKEND=$backend" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Save-Receipt }
      - name: Prepare synthetic differential harness
        shell: python
        run: |
          import os,json,base64,zipfile,copy,hashlib
          from pathlib import Path
          p=json.loads('{"classes": {"SignerControlFlowProbe$1.class": "", "SignerControlFlowProbe$Kernel.class": "", "SignerControlFlowProbe$MemoryApi.class": "", "SignerControlFlowProbe.class": ""}, "runner": "\\"\\"\\"Two bounded synthetic local children: default vs CFG enabled at process creation.\\nNever disables a mitigation, loads account state, or connects to a service.\\n\\"\\"\\"\\nfrom pathlib import Path\\nimport ctypes as c,ctypes.wintypes as w,os,subprocess,json,hashlib,sys\\nW=Path(__file__).resolve().parent; R=W.parents[1]; B=W/\'post29-recovery-candidate/backend\'\\nsys.path.insert(0,str(W))\\nT=W/\'signer-debug-tools\';O=R/\'outputs/account-sync/post35-controlflow\'\\nB=Path(os.environ.get(\'PROBE_BACKEND\',str(B)));T=Path(os.environ.get(\'PROBE_TOOLS\',str(T)));O=Path(os.environ.get(\'PROBE_OUTPUT\',str(O)))\\nO.mkdir(exist_ok=True)\\nk=c.WinDLL(\'kernel32\',use_last_error=True);P=c.c_void_p;SZ=c.c_size_t\\nclass SA(c.Structure):_fields_=[(\'nLength\',w.DWORD),(\'descriptor\',P),(\'inherit\',w.BOOL)]\\nclass SI(c.Structure):\\n _fields_=[(\'cb\',w.DWORD),(\'reserved\',w.LPWSTR),(\'desktop\',w.LPWSTR),(\'title\',w.LPWSTR),(\'x\',w.DWORD),(\'y\',w.DWORD),(\'xs\',w.DWORD),(\'ys\',w.DWORD),(\'xc\',w.DWORD),(\'yc\',w.DWORD),(\'fill\',w.DWORD),(\'flags\',w.DWORD),(\'show\',w.WORD),(\'reserved2len\',w.WORD),(\'reserved2\',P),(\'stdin\',P),(\'stdout\',P),(\'stderr\',P)]\\nclass SX(c.Structure):_fields_=[(\'si\',SI),(\'attributes\',P)]\\nclass PI(c.Structure):_fields_=[(\'process\',P),(\'thread\',P),(\'pid\',w.DWORD),(\'tid\',w.DWORD)]\\ndef api(name,result,types):\\n f=getattr(k,name);f.restype=result;f.argtypes=types;return f\\ninit=api(\'InitializeProcThreadAttributeList\',w.BOOL,[P,w.DWORD,w.DWORD,c.POINTER(SZ)])\\nupdate=api(\'UpdateProcThreadAttribute\',w.BOOL,[P,w.DWORD,SZ,P,SZ,P,P])\\ndelete=api(\'DeleteProcThreadAttributeList\',None,[P]);close=api(\'CloseHandle\',w.BOOL,[P])\\ncreatefile=api(\'CreateFileW\',P,[w.LPCWSTR,w.DWORD,w.DWORD,c.POINTER(SA),w.DWORD,w.DWORD,P])\\ncreate=api(\'CreateProcessW\',w.BOOL,[w.LPCWSTR,w.LPWSTR,P,P,w.BOOL,w.DWORD,P,w.LPCWSTR,P,c.POINTER(PI)])\\nwait=api(\'WaitForSingleObject\',w.DWORD,[P,w.DWORD]);exitcode=api(\'GetExitCodeProcess\',w.BOOL,[P,c.POINTER(w.DWORD)])\\nterminate=api(\'TerminateProcess\',w.BOOL,[P,w.UINT]);results=[]\\nregister=\'--register-targets\' in sys.argv\\nmetadata=\'--longjump-metadata\' in sys.argv\\ncapture=any(arg.startswith(\'--dump\') for arg in sys.argv[1:])\\nif capture:from capture_synthetic_fastfail import watch\\nfor enabled in ((True,) if register or metadata or capture else (False,True)):\\n name=\'cfg-\'+next(arg[2:] for arg in sys.argv[1:] if arg.startswith(\'--dump\')) if capture else \'cfg-longjump-metadata\' if metadata else \'cfg-targets\' if register else \'cfg-on\' if enabled else \'default\';log=O/(name+\'.log\');receipt=O/(name+\'.json\')\\n assert not receipt.exists(),\'Completed or unknown probe must not be replayed\'\\n temp=O/(name+\'-temp\');temp.mkdir(exist_ok=True)\\n env={key:os.environ[key] for key in (\'SystemRoot\',\'WINDIR\',\'PATH\') if key in os.environ};env.update(TEMP=str(temp),TMP=str(temp))\\n envblock=c.create_unicode_buffer(\'\\\\0\'.join(key+\'=\'+value for key,value in sorted(env.items()))+\'\\\\0\\\\0\')\\n args=[str(B/\'jre/bin/java.exe\'),\'-Djava.io.tmpdir=\'+str(temp),\'--add-opens\',\'java.base/java.lang=ALL-UNNAMED\',\'-Xmx128m\',\'-cp\',str(T)+\';\'+str(B/\'sign/unidbg-sign.jar\'),\'SignerControlFlowProbe\']\\n if os.environ.get(\'PROBE_JAR\'):args[args.index(\'-cp\')+1]=str(T)+\';\'+os.environ[\'PROBE_JAR\']\\n if register:args.append(\'register-targets\')\\n if metadata:args[args.index(\'-cp\')+1]=str(T)+\';\'+str(T/\'unidbg-longjump-metadata.jar\')\\n command=c.create_unicode_buffer(subprocess.list2cmdline(args));s=SX();s.si.cb=c.sizeof(s) if enabled else c.sizeof(SI);s.si.flags=0x100\\n sa=SA(c.sizeof(SA),None,True);output=createfile(str(log),0x40000000,3,c.byref(sa),2,0x80,None);inp=createfile(\'NUL\',0x80000000,3,c.byref(sa),3,0x80,None)\\n assert output not in (None,P(-1).value) and inp not in (None,P(-1).value)\\n s.si.stdout=output;s.si.stderr=output;s.si.stdin=inp\\n attr=None;pi=PI();row=dict(state=\'starting\',cfgRequested=enabled,networkRequests=0,syntheticOnly=True)\\n receipt.write_text(json.dumps(row),encoding=\'utf8\')\\n try:\\n  flags=0x08000000|0x400\\n  if capture:flags|=2\\n  if enabled:\\n   size=SZ();init(None,1,0,c.byref(size));attr=c.create_string_buffer(size.value)\\n   assert init(attr,1,0,c.byref(size));s.attributes=c.cast(attr,P)\\n   policy=c.c_ulonglong(1<<40) # PROCESS_CREATION_MITIGATION_POLICY_CONTROL_FLOW_GUARD_ALWAYS_ON\\n   assert update(attr,0,0x20007,c.byref(policy),c.sizeof(policy),None,None)\\n   flags|=0x80000\\n  if not create(str(B/\'jre/bin/java.exe\'),command,None,None,True,flags,envblock,str(T),c.byref(s),c.byref(pi)):raise c.WinError(c.get_last_error())\\n  if capture:\\n   row[\'dumpCaptured\']=watch(pi.process,pi.pid,O)\\n  timed=wait(pi.process,30000)==258\\n  if timed:terminate(pi.process,99);wait(pi.process,5000)\\n  code=w.DWORD();assert exitcode(pi.process,c.byref(code));row.update(state=\'completed\',exitCode=code.value,exitHex=hex(code.value),timedOut=timed)\\n finally:\\n  if pi.thread:close(pi.thread)\\n  if pi.process:close(pi.process)\\n  close(output);close(inp)\\n  if attr is not None:delete(attr)\\n  receipt.write_text(json.dumps(row,indent=2),encoding=\'utf8\')\\n print(json.dumps(row),flush=True);print(log.read_text(errors=\'replace\')[-1800:],flush=True)\\n"}')
          root=Path(os.environ['GITHUB_WORKSPACE']);tools=root/'probe-tools';tools.mkdir()
          for name,value in p['classes'].items():(tools/name).write_bytes(base64.b64decode(value))
          (tools/'run.py').write_text(p['runner'],encoding='utf8')
          backend=Path(os.environ['PROBE_BACKEND']);source=backend/'sign/unidbg-sign.jar';jar=tools/'candidate.jar'
          native=(root/'native-candidate/unicorn.dll').read_bytes()
          with zipfile.ZipFile(source) as z,zipfile.ZipFile(jar,'w') as output:
           for item in z.infolist():output.writestr(copy.copy(item),native if item.filename=='natives/windows_64/unicorn.dll' else z.read(item))
          with zipfile.ZipFile(source) as a,zipfile.ZipFile(jar) as b:
           changed=[n for n in a.namelist() if hashlib.sha256(a.read(n)).digest()!=hashlib.sha256(b.read(n)).digest()]
           assert changed==['natives/windows_64/unicorn.dll']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
           f.write('PROBE_TOOLS='+str(tools)+'\nPROBE_JAR='+str(jar)+'\nPROBE_OUTPUT='+str(root/'signer-evidence/controlflow')+'\n')
      - name: Run default and CFG-on synthetic callbacks once
        shell: pwsh
        run: |
          python probe-tools/run.py
          if ($LASTEXITCODE -ne 0) { throw 'Harness failed' }
          foreach($name in @('default','cfg-on')) {
            $r=Get-Content "signer-evidence/controlflow/$name.json" -Raw | ConvertFrom-Json
            $log=Get-Content "signer-evidence/controlflow/$name.log" -Raw
            if ($r.exitCode -ne 0 -or $log -notmatch 'EMULATION_RETURNED=true' -or $log -notmatch 'CLOSED=true') { throw "Engine regression: $name" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-engine-${{ matrix.os }}
          path: signer-evidence/
          retention-days: 3

