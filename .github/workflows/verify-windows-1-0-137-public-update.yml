name: Verify released Windows 1.0.137 updater
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-windows-1.0.137-public-update
  cancel-in-progress: false
jobs:
  verify-release:
    if: github.repository == 'waligoraamodio288-rgb/hongguo-desktop-releases'
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - name: Check, download, install and restart from the 1.0.116 public release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($directory in @('C:\GuobanInput','C:\GuobanOutput','C:\GuobanBaseSetup')) {
            if (Test-Path -LiteralPath $directory) { throw 'Fresh Windows VM required' }
            New-Item -ItemType Directory -Path $directory | Out-Null
          }
          $encoded = ''
          $payload = ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded)) | ConvertFrom-Json)
          foreach ($entry in $payload.PSObject.Properties) {
            if ($entry.Name -cnotin @('guest.ps1','ui.py','plan.json')) { throw 'Unexpected test input' }
            [IO.File]::WriteAllBytes((Join-Path 'C:\GuobanInput' $entry.Name),[Convert]::FromBase64String($entry.Value))
          }
          python -c "import sys; assert sys.version_info >= (3, 11)"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.11 or newer required' }
          python -m pip --disable-pip-version-check install --quiet requests==2.32.5 websockets==15.0.1
          if ($LASTEXITCODE -ne 0) { throw 'Python test tools unavailable' }
          $baseUrl = 'https://github.com/waligoraamodio288-rgb/hongguo-desktop-releases/releases/download/v1.0.116/hongguo-1.0.116-windows-x86_64-setup.exe'
          curl.exe --disable --silent --show-error --fail --location --max-time 120 --output C:\GuobanBaseSetup\base.exe $baseUrl
          if ($LASTEXITCODE -ne 0) { throw 'Live rollback installer download failed' }
          $expected = (Get-Content C:\GuobanInput\plan.json -Raw -Encoding UTF8 | ConvertFrom-Json).baseInstallerSha256
          if ((Get-FileHash C:\GuobanBaseSetup\base.exe).Hash -ine $expected) { throw 'Public base digest mismatch' }
          & C:\GuobanInput\guest.ps1
          $result = Get-Content C:\GuobanOutput\result.json -Raw -Encoding UTF8
          Write-Output $result
          if (!(($result | ConvertFrom-Json).passed)) { exit 1 }
      - name: Preserve isolated updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-137-native-update
          path: |
            C:\GuobanOutput\result.json
            C:\GuobanOutput\update.json
            C:\GuobanOutput\verify.json
            C:\GuobanOutput\app116.stderr.txt
          retention-days: 14
          if-no-files-found: warn