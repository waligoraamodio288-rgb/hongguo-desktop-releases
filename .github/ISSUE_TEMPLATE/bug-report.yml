name: 安装或播放问题
description: 告诉我们卡在哪一步，帮助复现和修复。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请先查看 README 已知问题。不要上传账号密码、令牌或私人观看记录，截图请遮住无关信息。"
  - type: dropdown
    id: system
    attributes:
      label: 操作系统
      options:
        - Windows 11 x64
        - Windows 10 x64
        - 不确定或其他（请在说明中补充）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: 例如 1.0.0，可在应用设置中查看
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何出现这个问题
      description: 写出操作步骤、预期结果、实际结果和错误提示。播放问题可补充单个出错集数，不必提供观看历史。
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 当前使用情况
      options:
        - 尚未完成下载或安装
        - 已安装，尚未成功播放
        - 能够播放，但部分操作有问题
        - 不确定或其他
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 在哪里看到的软件（选填）
      placeholder: 例如知乎、B站、小众软件、GitHub、朋友推荐；也可以不填
